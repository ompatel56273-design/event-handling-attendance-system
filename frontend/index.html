    <script>
      // Early suppression of third-party extension errors
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes('startTime') || e.message?.includes('reportAllChanges') || e.filename?.includes('anonymous'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
    </script>

    <div id="root"></div>
